[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picobot-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "keyboard>=0.13.5",
    "pygetwindow>=0.0.9",
    "pyserial>=3.5",
    "requests>=2.32.5",
    "websockets>=15.0.1",
    # Smart bot (python -m picobot.bot / SMART button)
    "mss>=9.0.2",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.optional-dependencies]
# Template matching used by planned detectors (e.g. lie-detector prompts).
cv = ["opencv-python-headless>=4.8"]

[tool.setuptools.packages.find]
where = ["."]
