[workspace]
resolver = "2"
members = ["crates/core", "crates/io", "crates/host"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: objects keep insertion order, like Python dicts, so files
# we write match what the Python host writes. float_roundtrip: parse floats
# exactly (the default parser can be off by one ulp).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
debug = 1          # symbols for profiling (flamegraph) without slowing it down

# Deployment build: no symbols, no source paths.
#   cargo build --profile dist -p picobot-host   (-> target/dist/picobot.exe)
[profile.dist]
inherits = "release"
debug = 0
strip = "symbols"
lto = "thin"
