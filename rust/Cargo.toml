[workspace]
resolver = "2"
members = ["crates/core", "crates/io", "crates/host"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1          # symbols for profiling (flamegraph) without slowing it down
