[package]
name = "picobot-host"
description = "The PicoBot host: bot thread, map monitor, dashboard server, frame streamer."
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "picobot"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
picobot-core = { path = "../core" }
picobot-io = { path = "../io" }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "signal"] }
serde_json.workspace = true
