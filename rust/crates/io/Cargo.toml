[package]
name = "picobot-io"
description = "Windows-facing I/O: serial HID link, window lookup, screen capture, OCR."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
picobot-core = { path = "../core" }
serialport = "4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
