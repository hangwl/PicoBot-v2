<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicoBot Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --edge: #262b36;
    --fg: #d7dce3; --dim: #8a919e; --accent: #4f8cff;
    --ok: #3fb96f; --warn: #d9a13b; --bad: #d95656;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
  }
  header {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--edge);
  }
  header b { font-size: 15px; }
  .chip {
    padding: 2px 10px; border: 1px solid var(--edge); border-radius: 20px;
    font-size: 12px; color: var(--dim);
  }
  .chip.on { color: var(--ok); border-color: var(--ok); }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .chip.bad { color: var(--bad); border-color: var(--bad); }
  main { display: flex; gap: 12px; padding: 12px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 12px; flex: 1 1 300px; min-width: 0; }
  .panel {
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 8px; padding: 10px;
  }
  .panel h3 { margin: 0 0 8px; font-size: 12px; color: var(--dim);
    text-transform: uppercase; letter-spacing: .08em; }
  canvas#view {
    display: block; background: #000; border-radius: 4px;
    image-rendering: pixelated; width: 100%; max-width: 520px; height: auto;
    touch-action: none;
  }
  #now {
    padding: 6px 14px; background: #14161c; border-bottom: 1px solid var(--edge);
    font-size: 13px; color: var(--fg); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #now .warn { color: var(--warn); }
  details.panel > summary {
    cursor: pointer; font-size: 12px; color: var(--dim);
    text-transform: uppercase; letter-spacing: .08em;
    list-style: none; user-select: none;
  }
  details.panel > summary::before { content: "▸ "; }
  details[open].panel > summary::before { content: "▾ "; }
  details.panel > summary::-webkit-details-marker { display: none; }
  button.armed { border-color: var(--warn); color: var(--warn); }
  select, input { max-width: 100%; min-width: 0; }
  @media (max-width: 640px) {
    main { padding: 8px; gap: 8px; }
    .col { gap: 8px; flex-basis: 100%; }
    header { gap: 8px; padding: 8px 10px; }
    #now { padding: 6px 10px; }
    #log { height: 260px; }
    button, select, input { padding: 8px 10px; }
    button { min-height: 40px; }
    .pad button { height: 44px; }
  }
  #log {
    height: 420px; overflow-y: auto; font-size: 12px; white-space: pre-wrap;
  }
  #log div { padding: 1px 0; border-bottom: 1px solid #1d212b; }
  .ltab {
    padding: 2px 10px; font-size: 11px; border-radius: 10px;
  }
  .ltab.on { border-color: var(--accent); color: var(--accent); }
  .k-debug { color: #565f6e; }
  .k-log { color: var(--dim); }
  .k-fsm { color: var(--accent); }
  .k-nav, .k-map { color: #9d7bff; }
  .k-skill, .k-hid { color: #4ec9b0; }
  .k-safety, .k-error { color: var(--bad); }
  .k-notify { color: var(--warn); }
  .k-bot, .k-cal, .k-status, .k-remote { color: var(--fg); }
  button, select, input {
    background: #20242e; color: var(--fg); border: 1px solid var(--edge);
    border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pad { display: grid; grid-template-columns: repeat(3, 44px); gap: 5px; }
  .pad button { height: 40px; font-size: 16px; padding: 0; }
  .pad .spacer { visibility: hidden; }
  label { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <b>PicoBot</b>
  <span id="ws" class="chip">ws: connecting…</span>
  <span id="serial" class="chip">serial: –</span>
  <span id="win" class="chip">win: –</span>
  <span id="layout" class="chip">layout: –</span>
  <span id="bot" class="chip">bot: ?</span>
  <span id="state" class="chip">state: –</span>
  <span id="map" class="chip">map: –</span>
  <span id="hazard" class="chip">hazard: none</span>
</header>
<div id="now">connecting…</div>
<div id="status" class="row" style="padding:4px 14px; background:#101218; border-bottom:1px solid var(--edge); font-size:11px; color:var(--dim)">
  <span id="stMap">map: –</span> ·
  <span id="stClass">class: –</span> ·
  <span id="stPolicy">policy: –</span>
</div>
<main>
  <div class="col" style="flex:1.2 1 360px">
    <div class="panel">
      <h3>Map</h3>
      <div class="row">
        <select id="mapSel" style="min-width:170px"
          title="auto = detect by map title (OCR); picking a map pins it as the target for every section below">
          <option value="">(auto-detect)</option>
        </select>
        <input id="mapNew" placeholder="new map name" size="14"
          style="display:none" title="name for the map a calibration save will create">
      </div>
      <div style="margin-top:6px"><label id="mapDet">detected: –</label></div>
      <div style="margin-top:4px"><label>one selection drives walls, platforms, layout and calibration below — no per-section map names</label></div>
    </div>
    <div class="panel">
      <h3>View</h3>
      <canvas id="view" width="400" height="300"></canvas>
      <div class="row" style="margin-top:8px">
        <button id="vMin" title="the whole located panel: title strip on top, minimap below the divider">Panel</button>
        <button id="vWin">Window</button>
        <button id="vTitle" title="the segmented title band exactly as OCR sees it — green boxes = accepted text lines, orange = OCR input crop">Title</button>
        <select id="fpsSel" title="stream rate">
          <option value="3">3 fps</option>
          <option value="6">6 fps</option>
          <option value="10">10 fps</option>
          <option value="15">15 fps</option>
          <option value="24">24 fps</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="layoutSave">Save layout</button>
        <button id="layoutClear">Forget</button>
        <button id="layoutReset">Re-detect</button>
        <label>targets the Map selection (auto = verified map only)</label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="drawMinimap">Draw minimap</button>
        <button id="drawTitle" title="drag a rect around the title text on the Window view — overrides auto title detection">Draw title</button>
        <label>drag a rect on the Window view</label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="drawPlats" title="arm, then drag along each platform on the Minimap view — click again to stop">Draw plats</button>
        <button id="platUndo" title="remove the last drawn platform segment">Undo</button>
        <button id="platClear" title="remove all platforms for this map">Clear</button>
        <label>platforms are hand-drawn — the bot's walkable geometry (uses Map selection)</label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="placeAnchors" title="arm, then click the Panel view to place a patrol anchor (floats above the drawn platform like the player icon); shift-click removes the nearest — click again to stop">Place anchors</button>
        <button id="anchorUndo" title="remove the last placed anchor">Undo</button>
        <button id="anchorClear" title="remove all anchors for this map">Clear</button>
        <label>anchors = patrol checkpoints (uses Map selection)</label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="navRoute" title="show the movement graph (greens: up flash / up-side flash / rope lift; oranges: down-jump / drop; purples: jump / flash / double flash); click the minimap to preview the route from the player (yellow)">Route</button>
        <label>preview planned routes — click a destination on the Panel view</label>
      </div>
    </div>
    <div class="panel">
      <h3>Bot</h3>
      <div class="row">
        <button id="startBot" class="primary">Start</button>
        <button id="stopBot" class="danger">Stop</button>
      </div>
      <div class="row" style="margin-top:8px">
        <select id="classSel" style="min-width:150px"
          title="class profile: decides the movement kit (flash/teleport/walk), where attacks fire, and which moves the planner may use">
          <option value="">(class)</option>
        </select>
        <label id="kitLbl" style="min-width:0">–</label>
      </div>
      <div class="row" id="classNewRow" style="margin-top:6px; display:none">
        <input id="classNewName" placeholder="profile name" size="10">
        <select id="classNewTravel" title="movement kit">
          <option value="flash">flash</option>
          <option value="teleport">teleport</option>
          <option value="walk">walk</option>
        </select>
        <label><input type="checkbox" id="classNewAir" checked> air attacks</label>
        <input id="classNewKey" placeholder="tp key" size="6" style="display:none"
          title="teleport skill key (teleport travel only)">
        <button id="classAdd" class="primary">Add</button>
      </div>
      <div class="row" style="margin-top:6px">
        <select id="policySel" title="loop ordering policy">
          <option value="weighted">weighted</option>
          <option value="greedy">greedy</option>
        </select>
        <input id="policyTemp" type="number" step="0.1" min="0.05" style="width:64px"
          title="weighted roulette temperature: lower = more uniform, higher = more greedy">
        <label>patrol policy</label>
      </div>
    </div>
    <details class="panel" open>
      <summary>Setup checklist</summary>
      <div class="row"><span id="ckMap" class="chip">map: –</span><label>title OCR identifies the map</label></div>
      <div class="row"><span id="ckPlatsN" class="chip">platforms: –</span><button id="ckPlatsBtn">Draw plats</button></div>
      <div class="row"><span id="ckAnchorsN" class="chip">anchors: –</span><button id="ckAnchorsBtn">Place anchors</button></div>
      <div class="row"><span id="ckMeasureN" class="chip">measured: –</span><button id="ckMeasureBtn">Measure</button></div>
      <div style="margin-top:4px"><label>identify → draw platforms → place anchors → measure moves → Start</label></div>
    </details>
    <details class="panel" open>
      <summary>Measure moves</summary>
      <div class="row">
        <button id="measureStart" class="primary">Measure moves</button>
        <button id="measureStop">Stop</button>
      </div>
      <div style="margin-top:6px"><label id="measureStat">stop the bot, stand on an open platform, then measure — real jump ranges are saved to nav_reach.json</label></div>
    </details>
  </div>
  <div class="col" style="flex:1.4 1 340px">
    <div class="panel" style="flex:1">
      <h3>Events</h3>
      <div class="row" style="margin-bottom:6px">
        <button class="ltab" data-lv="0">all</button>
        <button class="ltab on" data-lv="1">info</button>
        <button class="ltab" data-lv="2">warn</button>
        <button class="ltab" data-lv="3">error</button>
      </div>
      <div id="log"></div>
    </div>
  </div>
  <div class="col" style="flex:1 1 300px">
    <details class="panel" open>
      <summary>Connection</summary>
      <div class="row">
        <select id="portSel" style="min-width:150px"><option value="">(serial)</option></select>
        <button id="portAuto">Auto</button>
      </div>
      <div class="row" style="margin-top:8px">
        <select id="winSel" style="min-width:220px"><option value="">(window)</option></select>
        <button id="connRefresh">Refresh</button>
      </div>
      <div style="margin-top:6px"><label>selections are remembered</label></div>
    </details>
    <details class="panel">
      <summary>Movement keys</summary>
      <div class="row">
        <label>jump</label><input id="mkJump" size="6" placeholder="space">
        <label>rope lift</label><input id="mkRope" size="6" placeholder="(combo)">
        <label><input id="mkFjOn" type="checkbox"> FJ on</label>
      </div>
      <div class="row">
        <label>nav radius</label><input id="mkNavR" type="number" min="2" max="15" step="1" style="width:52px">
        <label>wall zone</label><input id="mkWallZ" type="number" min="0" max="60" step="1" style="width:52px">
        <label><input id="mkWeave" type="checkbox"> weave at anchors</label>
      </div>
      <div style="margin-top:6px"><label>jump = jump/down-jump key · rope lift = up-jump skill, 3s cooldown (blank = jump+up+jump combo) · FJ on = flash-jump with the jump key (press jump again mid-air) · nav radius = px tolerance for "arrived" · wall zone = px margin at map edges that forces an inward facing (no wall-banging) · weave = keep moving + attacking at anchors instead of standing still. Saves instantly.</label></div>
    </details>
    <details class="panel">
      <summary>Skills</summary>
      <div style="margin-bottom:4px"><label id="skillSrc">editing: global skills</label></div>
      <div id="skillRows"></div>
      <div class="row" style="margin-top:8px">
        <input id="skName" placeholder="name" size="7">
        <input id="skKey" placeholder="key" size="4">
        <select id="skKind">
          <option>attack</option><option>summon</option>
          <option>buff</option><option>movement</option>
        </select>
        <input id="skCd" type="number" min="0" step="0.1" placeholder="cd" title="cooldown (s)" style="width:58px">
        <input id="skWait" type="number" min="0" step="0.1" placeholder="wait" title="wait on arrival (s)" style="width:58px">
        <button id="skAdd">Add</button>
      </div>
      <div style="margin-top:6px"><label>attack = used during dwell · summon = fired at anchors · buff = on cooldown · movement = keybind only, ignored in combat (e.g. flash jump). Edits save instantly and apply to a running bot.</label></div>
    </details>
    <details class="panel">
      <summary>Remote input</summary>
      <div class="row">
        <div class="pad">
          <span class="spacer"></span><button data-k="up">↑</button><span class="spacer"></span>
          <button data-k="left">←</button><button data-k="down">↓</button><button data-k="right">→</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="row"><input id="keyIn" placeholder="key" size="6">
            <button id="keyPress">press</button></div>
          <div class="row">
            <button data-k="alt">alt</button>
            <button data-k="ctrl">ctrl</button>
            <button data-k="shift">shift</button>
            <button data-k="enter">enter</button>
          </div>
        </div>
      </div>
      <div style="margin-top:6px"><label>tap = press · rune arrows work</label></div>
    </details>
  </div>
</main>
<script>
const WS_PORT = "REPLACE_WS_PORT";
const WS_SCHEME = "REPLACE_WS_SCHEME";
let ws = null, wsRetry = 500;
const $ = id => document.getElementById(id);
const logEl = $("log");
const SEV = { debug: 0, info: 1, warn: 2, error: 3 };
let logMinSev = 1;                 // "info" tab is the default view
const logBuf = [];                 // events kept for tab re-renders

function lineDiv(ev) {
  const d = document.createElement("div");
  d.className = "k-" + (ev.level === "debug" ? "debug" : ev.kind);
  const t = new Date((ev.t || Date.now() / 1000) * 1000)
    .toTimeString().slice(0, 8);
  d.textContent = `[${t}] ${ev.msg}`;
  return d;
}

function renderLog() {
  logEl.innerHTML = "";
  logBuf.forEach(ev => {
    if (SEV[ev.level] >= logMinSev) logEl.appendChild(lineDiv(ev));
  });
  logEl.scrollTop = logEl.scrollHeight;
}

function log(kind, msg, level, t) {
  const ev = { kind, msg, level: level || "info", t };
  logBuf.push(ev);
  if (logBuf.length > 600) logBuf.shift();
  if (SEV[ev.level] >= logMinSev) {
    logEl.appendChild(lineDiv(ev));
    while (logEl.children.length > 600) logEl.firstChild.remove();
    logEl.scrollTop = logEl.scrollHeight;
  }
}

document.querySelectorAll(".ltab").forEach(b => {
  b.onclick = () => {
    logMinSev = parseInt(b.dataset.lv, 10);
    document.querySelectorAll(".ltab")
      .forEach(x => x.classList.toggle("on", x === b));
    renderLog();
  };
});

function chip(id, text, cls) {
  const el = $(id);
  el.textContent = text;
  el.className = "chip" + (cls ? " " + cls : "");
}

function connect() {
  ws = new WebSocket(`${WS_SCHEME}://${location.hostname}:${WS_PORT}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    wsRetry = 500;
    chip("ws", "ws: connected", "on");
    ["dash|subscribe|frames", "events|history", "bot|query", "config|get",
     "skills|list", "host|state", "map|list", "class|list"].forEach(m => ws.send(m));
  };
  ws.onclose = () => {
    chip("ws", `ws: reconnecting in ${Math.round(wsRetry / 1000)}s`, "bad");
    setTimeout(connect, wsRetry);
    wsRetry = Math.min(wsRetry * 2, 10000);
  };
  ws.onerror = () => chip("ws", "ws: error", "warn");
  ws.onmessage = onMessage;
}

// Binary frame: "PBF1" | uint32 BE json length | json meta | JPEG bytes.
function onFrame(buf) {
  const dv = new DataView(buf);
  const n = dv.getUint32(4);
  const p = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, n)));
  const url = URL.createObjectURL(
    new Blob([new Uint8Array(buf, 8 + n)], { type: "image/jpeg" }));
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    const c = $("view");
    if (c.width !== img.width || c.height !== img.height) {
      c.width = img.width; c.height = img.height;
    }
    c.getContext("2d").drawImage(img, 0, 0);
    lastImg = img;
  };
  img.src = url;
  return p;
}

function onMessage(e) {
  if (e.data instanceof ArrayBuffer) { showFrame(onFrame(e.data)); return; }
  const m = e.data;
  if (m === "bot|running") { chip("bot", "bot: running", "on"); return; }
  if (m === "bot|stopped") { chip("bot", "bot: stopped"); return; }
  if (!m.startsWith("dash|")) return;
  let p;
  try { p = JSON.parse(m.slice(5)); } catch { return; }
  handleDash(p);
}

function showFrame(p) {
    viewOX = p.ox || 0; viewOY = p.oy || 0;  // minimap offset in panel view
    if (p.state) chip("state", "state: " + p.state,
      p.state === "PAUSE" ? "warn" : "");
    if (p.map !== undefined || p.no_rotation !== undefined)
      chip("map",
        "map: " + (p.map || "–") +
        (p.map_via === "pin" ? " (pinned)" : "") +
        (p.map_conf != null ? ` (${Math.round(p.map_conf * 100)}%)` : "") +
        (p.no_rotation ? " (no rotation)" : ""),
        p.no_rotation ? "warn" : "");
    if (p.layout !== undefined)
      chip("layout", "layout: " + (p.layout || "–"),
        p.layout === "auto" ? "warn" : "");

    chip("hazard", "hazard: " + (p.hazard || "none"), p.hazard ? "bad" : "");
    const now = $("now");
    now.textContent =
      (p.state || "IDLE") +
      (p.map ? " · " + p.map : " · no map") +
      (p.no_rotation ? " (no rotation)" : "") +
      (p.hazard ? " ⚠ " + p.hazard : "");
    now.style.color = p.hazard ? "var(--bad)"
      : p.state === "PAUSE" ? "var(--warn)" : "var(--fg)";
}

function handleDash(p) {
  if (p.event === "evt") {
    if (p.kind === "measure" && !p.msg.startsWith("measurement"))
      $("measureStat").textContent = p.msg;
    log(p.kind, p.msg, p.level, p.t);
    if (p.kind === "bot")
      chip("bot", "bot: " + p.msg, p.msg === "started" ? "on" : "");
  } else if (p.event === "history") {
    logBuf.length = 0;
    logEl.innerHTML = "";
    (p.items || []).forEach(it => log(it.kind, it.msg, it.level, it.t));
  } else if (p.event === "maps") {
    // Rebuild the selector without losing a "+ new map" pick in flight.
    const sel = $("mapSel"), cur = sel.value;
    sel.innerHTML = `<option value="">(auto-detect)</option>` +
      (p.maps || []).map(n => `<option>${esc(n)}</option>`).join("") +
      `<option value="__new">+ new map…</option>`;
    sel.value = (cur === "__new" || (p.maps || []).includes(cur)) ? cur
      : (p.active || "");
    $("mapNew").style.display = sel.value === "__new" ? "" : "none";
    $("mapDet").textContent = "detected: " + (p.detected || "–") +
      (p.via ? ` (${p.via})` : "") +
      (p.title ? ` · title "${p.title}"` : "") +
      (p.score != null ? ` ${Math.round(p.score * 100)}%` : "") +
      (p.reading ? " · reading title…" : "");
    setupState.plats = p.platforms_n || 0;
    setupState.anchors = p.anchors_n || 0;
    renderSetup();
  } else if (p.event === "class") {
    const sel = $("classSel"), cur = sel.value;
    sel.innerHTML = Object.keys(p.profiles || {}).sort()
      .map(n => `<option>${esc(n)}</option>`).join("") +
      `<option value="__new">+ new class…</option>`;
    sel.value = (p.profiles || {})[cur] ? cur : (p.active || "");
    classActive = sel.value;
    const kit = (p.profiles || {})[sel.value] || {};
    $("kitLbl").textContent = kitText(sel.value, kit);
    $("stClass").textContent = "class: " + kitText(sel.value, kit);
    $("policySel").value = p.policy || "weighted";
    $("policyTemp").value = p.temp != null ? p.temp : 1.0;
    $("stPolicy").textContent = `policy: ${p.policy || "–"} (${p.temp ?? "–"})`;
    setupState.measured = p.measured || 0;
    renderSetup();
  } else if (p.event === "host") {
    fillSel($("portSel"), "(serial)",
      (p.ports || []).map(pt => [pt.device, pt.device + (pt.desc ? " · " + pt.desc : "")]),
      p.serial);
    fillSel($("winSel"), "(window)",
      (p.windows || []).map(t => [t, t]),
      p.window);
    chip("serial", "serial: " + (p.serial || "–"),
      p.serial_open ? "on" : (p.serial ? "warn" : ""));
    chip("win", "win: " + (p.window || "–"));
  } else if (p.event === "skills") {
    $("skillSrc").textContent = "editing: " + (p.source || "global skills") +
      (p.source && p.source !== "global" ? "'s kit" : " skills");
    renderSkills(p.skills || {});
  } else if (p.event === "config") {
    const c = p.config || {};
    if (document.activeElement !== $("mkJump"))
      $("mkJump").value = c.jump_key || "";
    if (document.activeElement !== $("mkRope"))
      $("mkRope").value = c.up_jump_skill_key || "";
    $("mkFjOn").checked = c.flash_jump_enabled !== false;
    if (document.activeElement !== $("mkNavR"))
      $("mkNavR").value = c.nav_threshold_px ?? "";
    if (document.activeElement !== $("mkWallZ"))
      $("mkWallZ").value = c.wall_zone_px ?? "";
    $("mkWeave").checked = c.dwell_weave !== false;
    if (c.view_fps != null && document.activeElement !== $("fpsSel"))
      $("fpsSel").value = String(Math.round(c.view_fps));
  }
}

// --- Movement keys -------------------------------------------------------
function sendMoveKeys() {
  send("movekeys|set|" + JSON.stringify({
    jump_key: $("mkJump").value.trim(),
    up_jump_skill_key: $("mkRope").value.trim(),
    // FJ is jump-again-mid-air — always the jump key; clear stale overrides.
    flash_jump_key: "",
    flash_jump_enabled: $("mkFjOn").checked,
    nav_threshold_px: parseInt($("mkNavR").value, 10) || undefined,
    wall_zone_px: parseInt($("mkWallZ").value, 10) ?? undefined,
    dwell_weave: $("mkWeave").checked,
  }));
}
["mkJump", "mkRope", "mkNavR", "mkWallZ"].forEach(id =>
  $(id).addEventListener("change", sendMoveKeys));
["mkFjOn", "mkWeave"].forEach(id =>
  $(id).addEventListener("change", sendMoveKeys));

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// --- Skills panel -------------------------------------------------------
const SKILL_KINDS = ["attack", "summon", "buff", "movement"];

function renderSkills(skills) {
  const wrap = $("skillRows");
  wrap.innerHTML = "";
  const names = Object.keys(skills);
  if (!names.length) {
    wrap.innerHTML = "<label>no skills configured — attack won't fire without one</label>";
    return;
  }
  names.forEach(name => {
    const s = skills[name];
    const row = document.createElement("div");
    row.className = "row";
    row.style.marginTop = "6px";
    row.innerHTML =
      `<b style="min-width:80px;overflow:hidden;text-overflow:ellipsis">${esc(name)}</b>` +
      `<input class="sk-key" value="${esc(s.key)}" size="4" title="key">` +
      `<select class="sk-kind">${SKILL_KINDS.map(k =>
        `<option${k === s.kind ? " selected" : ""}>${k}</option>`).join("")}</select>` +
      `<input class="sk-cd" type="number" min="0" step="0.1" value="${s.cooldown || 0}" title="cooldown (s)" style="width:58px">` +
      `<input class="sk-wait" type="number" min="0" step="0.1" value="${s.wait_on_arrival || 0}" title="wait on arrival (s)" style="width:58px">` +
      `<button class="sk-del">✕</button>`;
    const spec = () => JSON.stringify({
      name,
      key: row.querySelector(".sk-key").value.trim(),
      kind: row.querySelector(".sk-kind").value,
      cooldown: parseFloat(row.querySelector(".sk-cd").value) || 0,
      wait_on_arrival: parseFloat(row.querySelector(".sk-wait").value) || 0,
    });
    row.querySelectorAll("input,select").forEach(el =>
      el.addEventListener("change", () => send("skills|set|" + spec())));
    row.querySelector(".sk-del").onclick = () => send("skills|del|" + name);
    wrap.appendChild(row);
  });
}

$("skAdd").onclick = () => {
  const name = $("skName").value.trim();
  const key = $("skKey").value.trim();
  if (!name || !key) return;
  send("skills|set|" + JSON.stringify({
    name, key,
    kind: $("skKind").value,
    cooldown: parseFloat($("skCd").value) || 0,
    wait_on_arrival: parseFloat($("skWait").value) || 0,
  }));
  $("skName").value = $("skKey").value = "";
};

// Populate a <select>; keep the current value as an option even if it
// wasn't enumerated (e.g. remembered port unplugged).
function fillSel(sel, placeholder, pairs, current) {
  sel.innerHTML = `<option value="">${placeholder}</option>`;
  let found = false;
  pairs.forEach(([v, label]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = label;
    if (v === current) { o.selected = true; found = true; }
    sel.appendChild(o);
  });
  if (current && !found) {
    const o = document.createElement("option");
    o.value = current; o.textContent = current + " (missing)";
    o.selected = true;
    sel.appendChild(o);
  }
}

const send = m => { if (ws.readyState === 1) ws.send(m); };
$("startBot").onclick = () => send("bot|start");
$("stopBot").onclick = () => send("bot|stop");
$("vMin").onclick = () => {
  if (drawMode) armDraw();  // region drags are window-view space
  send("dash|view|minimap");
};
$("vWin").onclick = () => {
  // Platform drags are minimap-space — disarm so a window-view drag
  // can't record bogus coordinates.
  if (platMode) armPlats();
  if (routeMode) armRoute();
  if (anchorMode) armAnchors();
  send("dash|view|window");
};
$("vTitle").onclick = () => {
  if (platMode) armPlats();
  if (drawMode) armDraw();
  send("dash|view|title");
};
$("fpsSel").onchange = () => send("dash|fps|" + $("fpsSel").value);

// --- Setup checklist + class/policy selectors --------------------------
const setupState = { map: "", plats: 0, anchors: 0, measured: 0 };
function kitText(name, kit) {
  if (!name) return "–";
  const t = kit.travel || "flash";
  const key = t === "teleport" && kit.teleport_key ? ` (${kit.teleport_key})` : "";
  return `${name} — ${t}${key}, ${kit.air_attacks === false ? "attacks on landing" : "air attacks"}`;
}
function renderSetup() {
  const set = (id, ok, txt) => {
    const el = $(id);
    el.textContent = el.textContent.split(":")[0] + ": " + txt;
    el.className = "chip " + (ok ? "on" : (ok === false ? "warn" : ""));
  };
  set("ckMap", !!setupState.map,
      setupState.map ? `identified (${setupState.map})` : "not identified");
  set("ckPlatsN", setupState.plats > 0, setupState.plats);
  set("ckAnchorsN", setupState.anchors >= 2, setupState.anchors);
  set("ckMeasureN", setupState.measured > 0,
      setupState.measured > 0 ? setupState.measured + " moves" : "no data");
}
$("ckPlatsBtn").onclick = () => armPlats();
$("ckAnchorsBtn").onclick = () => armAnchors();
$("ckMeasureBtn").onclick = () => send("measure|start");
$("policySel").onchange = () => send("patrol|policy|" + $("policySel").value);
$("policyTemp").onchange = () => {
  const v = parseFloat($("policyTemp").value);
  if (v >= 0.05) send("patrol|temp|" + v);
};

// The Map section handlers — every targeted action
// (walls, platforms, layout, calibration save) resolves through it.
$("mapSel").onchange = () => {
  const v = $("mapSel").value;
  $("mapNew").style.display = v === "__new" ? "" : "none";
  if (v === "__new") return;            // naming only — nothing to pin yet
  send("map|set|" + v);               // "" = auto-detect, else pin
};
const layTarget = () => {
  const v = $("mapSel").value;
  const n = v === "__new" ? $("mapNew").value.trim() : v;
  return n ? "|" + n : "";
};
$("layoutSave").onclick = () => send("layout|save" + layTarget());
$("layoutClear").onclick = () => send("layout|clear" + layTarget());
$("layoutReset").onclick = () => send("layout|reset");

// --- Drag-to-draw platforms on the Minimap view ------------------------
let platMode = false, platStart = null;
let routeMode = false, anchorMode = false;
function armAnchors() {
  anchorMode = !anchorMode;
  if (anchorMode && platMode) armPlats();
  if (anchorMode && routeMode) armRoute();
  if (anchorMode) send("dash|view|minimap");
  $("placeAnchors").className = anchorMode ? "armed" : "";
}
$("placeAnchors").onclick = () => armAnchors();
$("anchorUndo").onclick = () => send("layout|anchor|undo" + layTarget());
$("anchorClear").onclick = () => send("layout|anchor|clear" + layTarget());
function armRoute() {
  routeMode = !routeMode;
  if (routeMode && platMode) armPlats();
  if (routeMode && anchorMode) armAnchors();
  if (routeMode) send("dash|view|minimap");
  send("nav|show|" + (routeMode ? "on" : "off"));
  $("navRoute").className = routeMode ? "armed" : "";
}
$("navRoute").onclick = () => armRoute();
function armPlats() {
  platMode = !platMode;
  platStart = null;
  if (platMode && routeMode) armRoute();
  if (platMode && anchorMode) armAnchors();
  if (platMode) send("dash|view|minimap");
  $("drawPlats").className = platMode ? "armed" : "";
}
$("drawPlats").onclick = () => armPlats();
$("platUndo").onclick = () => send("layout|plat|undo" + layTarget());
$("platClear").onclick = () => send("layout|plat|clear" + layTarget());

// --- Drag-to-draw regions on the Window view ---------------------------
let drawMode = null, drawStart = null, lastImg = null;
let viewOX = 0, viewOY = 0;   // minimap region's offset inside the panel view
const viewEl = $("view");

function armDraw(kind) {
  drawMode = drawMode ? null : kind;  // click again to cancel
  if (drawMode) send("dash|view|window");
  $("drawMinimap").className = drawMode === "minimap" ? "armed" : "";
  $("drawTitle").className = drawMode === "title" ? "armed" : "";
}
$("drawMinimap").onclick = () => armDraw("minimap");
$("drawTitle").onclick = () => armDraw("title");

const viewXY = e => {
  const r = viewEl.getBoundingClientRect();
  return [
    (e.clientX - r.left) * viewEl.width / r.width,
    (e.clientY - r.top) * viewEl.height / r.height,
  ];
};
viewEl.addEventListener("pointerdown", e => {
  if (platMode) {
    platStart = viewXY(e);
    viewEl.setPointerCapture(e.pointerId);
    return;
  }
  if (!drawMode) return;
  drawStart = viewXY(e);
  viewEl.setPointerCapture(e.pointerId);
});
viewEl.addEventListener("pointermove", e => {
  if (platMode && platStart && lastImg) {
    const ctx = viewEl.getContext("2d");
    ctx.drawImage(lastImg, 0, 0);
    const [x, y] = viewXY(e);
    ctx.strokeStyle = "#28c8ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(platStart[0], platStart[1]);
    ctx.lineTo(x, y);
    ctx.stroke();
    return;
  }
  if (!drawStart || !lastImg) return;
  const ctx = viewEl.getContext("2d");
  ctx.drawImage(lastImg, 0, 0);
  const [x, y] = viewXY(e);
  ctx.strokeStyle = "#d9a13b";
  ctx.lineWidth = 2;
  ctx.strokeRect(drawStart[0], drawStart[1], x - drawStart[0], y - drawStart[1]);
});
viewEl.addEventListener("pointerup", e => {
  if (anchorMode) {
    const [x, y] = viewXY(e);
    const xy = `${Math.round(x - viewOX)},${Math.round(y - viewOY)}`;
    send((e.shiftKey ? `layout|anchor|del|${xy}` : `layout|anchor|${xy}`) + layTarget());
    return;
  }
  if (routeMode) {
    const [x, y] = viewXY(e);
    send(`nav|preview|${Math.round(x - viewOX)},${Math.round(y - viewOY)}`);
    return;
  }
  if (platMode) {
    if (platStart) {
      const [x, y] = viewXY(e);
      // Panel view: the minimap sits at (viewOX, viewOY) inside the
      // image — drag coords are panel coords, plat wants minimap px.
      send(`layout|plat|${Math.round(platStart[0] - viewOX)},${Math.round(platStart[1] - viewOY)},${Math.round(x - viewOX)},${Math.round(y - viewOY)}` + layTarget());
      platStart = null;
    }
    return;  // stays armed — draw the next platform
  }
  if (!drawStart) return;
  const [ex, ey] = viewXY(e);
  const x = Math.round(Math.min(drawStart[0], ex));
  const y = Math.round(Math.min(drawStart[1], ey));
  const w = Math.round(Math.abs(ex - drawStart[0]));
  const h = Math.round(Math.abs(ey - drawStart[1]));
  drawStart = null;
  if (w >= 10 && h >= 10)
    send(`layout|region|${drawMode}|${x},${y},${w},${h}`);
  armDraw();  // toggles off
});
$("portSel").onchange = e => { if (e.target.value) send("host|serial|" + e.target.value); };
$("winSel").onchange = e => { if (e.target.value) send("host|window|" + e.target.value); };
$("portAuto").onclick = () => send("host|serial|auto");
$("connRefresh").onclick = () => send("host|state");
$("measureStart").onclick = () => send("measure|start");
let classActive = "";
$("classSel").onchange = () => {
  const v = $("classSel").value;
  if (v === "__new") {
    $("classSel").value = classActive;      // revert until created
    $("classNewRow").style.display = "";
    $("classNewName").focus();
    return;
  }
  $("classNewRow").style.display = "none";
  if (v) send("class|use|" + v);
};
$("classNewTravel").onchange = () => {
  $("classNewKey").style.display =
    $("classNewTravel").value === "teleport" ? "" : "none";
};
$("classAdd").onclick = () => {
  const name = $("classNewName").value.trim();
  if (!name) { $("classNewName").focus(); return; }
  const travel = $("classNewTravel").value;
  const spec = {
    travel,
    air_attacks: $("classNewAir").checked,
  };
  if (travel === "teleport") spec.teleport_key = $("classNewKey").value.trim();
  send(`class|add|${name}|` + JSON.stringify(spec));
  $("classNewRow").style.display = "none";
  $("classNewName").value = "";
};
$("policySel").onchange = () => send("patrol|policy|" + $("policySel").value);
$("policyTemp").onchange = () => {
  const v = parseFloat($("policyTemp").value);
  if (v >= 0.05) send("patrol|temp|" + v);
};
$("measureStop").onclick = () => send("measure|stop");

// Remote input pad: tap sends down + up (~90ms hold, human-ish).
function press(key) {
  if (!key) return;
  send(`key|down|${key}`);
  setTimeout(() => send(`key|up|${key}`), 90 + Math.random() * 60);
}
document.querySelectorAll("[data-k]").forEach(b =>
  b.addEventListener("click", () => press(b.dataset.k)));
$("keyPress").onclick = () => {
  press($("keyIn").value.trim()); $("keyIn").select();
};
connect();
</script>
</body>
